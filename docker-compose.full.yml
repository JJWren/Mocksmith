# Overlay for the subscription-backed generation backend:
#   docker compose -f docker-compose.yml -f docker-compose.full.yml up -d --build
services:
  mocksmith:
    build:
      context: .
      dockerfile: Dockerfile.full
    image: mocksmith:full
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:?Set CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token` once)}
      - MOCKSMITH_GENERATOR=claude-code
