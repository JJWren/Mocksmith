name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Steps below are guarded so the workflow stays green until the
      # solution lands with M1 (hashFiles is empty pre-scaffold).
      - name: Setup .NET
        if: hashFiles('**/*.sln') != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        if: hashFiles('**/*.sln') != ''
        run: dotnet restore

      - name: Build
        if: hashFiles('**/*.sln') != ''
        run: dotnet build --configuration Release --no-restore

      - name: Test
        if: hashFiles('**/*.sln') != ''
        run: dotnet test --configuration Release --no-build --verbosity normal
