name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Steps below are guarded so the workflow stays green until the
      # solution lands with M1 (hashFiles is empty pre-scaffold).
      - name: Setup .NET
        if: hashFiles('**/*.slnx') != ''
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        if: hashFiles('**/*.slnx') != ''
        run: dotnet restore

      - name: Build
        if: hashFiles('**/*.slnx') != ''
        run: dotnet build --configuration Release --no-restore

      - name: Test
        if: hashFiles('**/*.slnx') != ''
        run: dotnet test --configuration Release --no-build --verbosity normal

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # Squash merges use the PR title as the commit on master, and release-please
      # derives versions from those commits, so titles must be conventional.
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            ci
            perf
            build
